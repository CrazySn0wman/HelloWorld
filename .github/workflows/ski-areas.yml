name: Update ski areas (OpenSkiMap)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  push:
    branches: [main]
    paths:
      - ".github/workflows/ski-areas.yml"
      - "tools/build_ski_areas.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build ski_areas.json
        run: python3 tools/build_ski_areas.py powder-monitor/ski_areas.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A powder-monitor/ski_areas.json tools/ski_areas_status.txt
          git diff --cached --quiet || (git commit -m "Update ski areas from OpenSkiMap" && git push)
